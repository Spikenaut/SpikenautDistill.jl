# Environment for the standalone Spikenaut sidecar (`spikenaut_train.jl`).
#
# The sidecar does not `using SynapticDistill`, and the library does not use
# JSON3 — so JSON3 belongs here rather than in the package's own [deps].
# Without this file `julia --project=. scripts/spikenaut_train.jl` only works
# when JSON3 happens to be installed in the user's global environment.
#
#   julia --project=scripts -e 'using Pkg; Pkg.instantiate()'
#   julia --project=scripts scripts/spikenaut_train.jl <data> <epochs> <out>

[deps]
JSON3 = "0f8b85d8-7281-11e9-16c2-39a750bddbf1"
LinearAlgebra = "37e2e46d-f89d-539d-b4ee-838fcccc9c8e"
Printf = "de0858da-6303-5e67-8744-51eddeeeb8d7"
Random = "9a3f8284-a2c9-5f02-9a11-845980a1fd5c"
Statistics = "10745b16-79ce-11e8-11f9-7d13ad32a3b2"

[compat]
JSON3 = "1"
julia = "1.8"
